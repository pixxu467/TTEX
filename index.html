<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Little Question ❤️</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#000;
  color:white;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  text-align:center;
  overflow:hidden;
}

.screen{
  width:90%;
  max-width:500px;
}

h1{
  font-size:30px;
  line-height:1.3;
}

p{
  color:#bbb;
  font-size:17px;
  line-height:1.5;
}

button{
  padding:14px 32px;
  margin:10px;
  font-size:19px;
  border:none;
  border-radius:30px;
  cursor:pointer;
  transition:0.3s;
}

#yes{
  background:#DC143C;
  color:white;
  box-shadow:0 0 20px rgba(220,20,60,0.4);
}

#yes:hover{
  background:#B01030;
  transform:scale(1.05);
}

#no{
  background:#444;
  color:white;
}

#continue{
  background:#DC143C;
  color:white;
  display:none;
  box-shadow:0 0 20px rgba(220,20,60,0.4);
}

#continue:hover{
  background:#B01030;
  transform:scale(1.05);
}

#permission{
  display:none;
}

#camera{
  display:none;
}

video{
  width:100%;
  max-width:400px;
  border-radius:20px;
  margin-top:20px;
  border:2px solid #DC143C;
  box-shadow:0 0 25px rgba(220,20,60,0.35);
}

.heart{
  font-size:70px;
  animation:beat 1s infinite;
  filter:drop-shadow(0 0 12px rgba(220,20,60,0.6));
}

@keyframes beat{
  0%,100%{
    transform:scale(1);
  }
  50%{
    transform:scale(1.18);
  }
}

.fade{
  animation:fadeIn 1.2s ease;
}

@keyframes fadeIn{
  from{
    opacity:0;
    transform:translateY(20px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}
</style>
</head>

<body>

<!-- FIRST SCREEN -->

<div id="home" class="screen fade">

  <h1>
    Do you really want to see my HER? ❤️
  </h1>

  <button id="yes" onclick="start()">YES</button>

  <button id="no" onclick="return false;">
    NO
  </button>

</div>


<!-- SECOND SCREEN -->

<div id="permission" class="screen fade">

  <div class="heart">✨👀✨</div>

  <h1>
    Okay... you said YES 🫣
  </h1>

  <p>
    sooo....ig it's time to show you ...
  </p>

  <button id="continue" onclick="openCamera()">
    Continue👀...
  </button>

</div>


<!-- CAMERA SCREEN -->

<div id="camera" class="screen fade">

  <h1>
  This is ✨HER✨....
  </h1>

  <p>
    😗How is she...??
  </p>

  <video id="cam" autoplay playsinline></video>

</div>


<script>

function start(){

  document.getElementById("home").style.display="none";

  document.getElementById("permission").style.display="block";

  document.getElementById("continue").style.display="inline-block";
}


async function openCamera(){

  try{

    const stream =
      await navigator.mediaDevices.getUserMedia({
        video:{
          facingMode:"user"
        },
        audio:false
      });

    document.getElementById("permission").style.display="none";

    document.getElementById("camera").style.display="block";

    document.getElementById("cam").srcObject=stream;

  }

  catch(e){

    alert("Camera permission is required to continue ❤️");

  }

}

</script>

</body>
</html>
